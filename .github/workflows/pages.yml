# Сборка Mini App и публикация на GitHub Pages: https://kifang.github.io/bonusprogram/
name: Mini App → GitHub Pages

on:
  push:
    branches: [main, claude/artist-loyalty-bonus-system-dtkzp8]
    paths: ["app/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /bonusprogram/
          # Публичные значения: адрес функции и publishable-ключ Supabase можно хранить в коде.
          VITE_API_URL: https://uuqqifeameaxgwwnpbhu.supabase.co/functions/v1/api
          VITE_SUPABASE_KEY: sb_publishable_xRwApKm7sHVY154h96aqCw_m11-yQGd
          VITE_BOT_USERNAME: ${{ vars.BOT_USERNAME }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
